name: suraksha
description: The Guardian On Your Wrist — Women's Safety IoT Wearable App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1

  geolocator: ^12.0.0
  geocoding: ^3.0.0

  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2

  http: ^1.2.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  intl: ^0.19.0

  marquee: ^2.2.3
  smooth_page_indicator: ^1.1.0

  flutter_blue_plus: ^1.32.12
  battery_plus: ^7.1.0
  flutter_local_notifications: ^17.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  socket_io_client: ^3.1.6
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/icons/
  fonts:
    # Bundled locally (not runtime-fetched) so the wordmark renders reliably
    # offline; scoped to the SURAKSHYA wordmark only.
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
